# Builds the app on every push and puts the APK on the "latest" release,
# so you can download it straight onto your phone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EarphoneFinder.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: EarphoneFinder-apk
          path: EarphoneFinder.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Built from ${GITHUB_SHA::7} on $(date -u '+%d %b %Y, %H:%M UTC'). Download EarphoneFinder.apk on your phone and tap to install."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest EarphoneFinder.apk --clobber
            gh release edit latest --notes "$NOTE"
          else
            gh release create latest EarphoneFinder.apk --title "Latest build" --notes "$NOTE" --prerelease
          fi
